<html> 
    <div class="container">
    <h1>Stop Changing Numbers</h1>
    <p>Click the number to stop or start changing!</p>

    <div id="number" onclick="toggleNumber()">1</div>

    <h3 id="status">Number is changing...</h3>

    <p>Click count: <span id="clickCount">0</span></p>

    <button onclick="toggleNumber()" id="toggleBtn">
        Stop Changing
    </button>
</div>
<script src="StopChangingNumbers.js"></script>
</html>
